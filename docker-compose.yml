# AI-Relay-Service — storage node example compose (T-120).
#
# Runs the storage service node against an *external* relay (the relay is
# not spun up here — point RELAY_URL at your running relay, e.g. the one from
# docker/server/docker-compose.yml). The storage node only needs the base
# image built; this compose builds it on the fly if you prefer, but the
# canonical flow is:
#
#   1. docker build -t ai-relay-node-base  -f docker/nodes/base/Dockerfile   .
#   2. docker build -t ai-relay-storage    -f docker/nodes/storage/Dockerfile .
#   3. docker compose -f docker/nodes/storage/docker-compose.yml up -d
#
# The node registers on first start (status=pending) — approve it via the
# relay dashboard or `relay-recovery admin approve-node <node_id>`.

name: ai-relay-storage

services:
  storage-node:
    build:
      context: ../..
      dockerfile: docker/nodes/storage/Dockerfile
      args:
        # Override when the base image lives in a registry. Default is the
        # local tag produced by `docker build -t ai-relay-node-base ...`.
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-ai-relay-node-base:latest}
    image: ai-relay-storage:local
    container_name: ai-relay-storage
    restart: unless-stopped
    environment:
      # Relay URL — REQUIRED. Point this at your running relay.
      RELAY_URL: ${RELAY_URL:?RELAY_URL is required}
      # Node name shown in the dashboard. Default: container hostname.
      NODE_NAME: ${NODE_NAME:-storage-node}
      # Role: storage is a service node, not a worker.
      NODE_ROLE: service
      # Optional upstream endpoint the relay can reach this node on (for
      # bridge-route upstream URLs). On a docker network this is typically
      # http://storage-node:8791 (container DNS name + NODE_PORT).
      NODE_ENDPOINT: ${NODE_ENDPOINT:-http://storage-node:8791}
      # Pre-created registration secret (rs_...). Optional — when unset the
      # node registers without one and must be approved manually.
      NODE_REGISTRATION_SECRET: ${NODE_REGISTRATION_SECRET:-}
      # Bridge server (T-128): the relay server IP the storage node accepts
      # upload/download channel requests from. Normally resolved from
      # RELAY_URL; set this explicitly when DNS does not return the IP the
      # relay uses to reach the storage node (e.g. a Tailscale IP).
      RELAY_SERVER_IP: ${RELAY_SERVER_IP:-}
    volumes:
      # NAS export — bind-mount your storage share here. The handlers
      # read/write under /storage (see STORAGE_PATH in the Dockerfile).
      - ${STORAGE_DIR:-./storage}:/storage
      # Persist node meta + token across restarts so the node does not
      # re-register (and get a new node_id) on every `up`.
      - storage-state:/home/appuser/.relay
    # No ports published — the relay reaches the node over the shared
    # docker network. Join the relay's network or set up an external one.
    # networks:
    #   - default
    #   - ai-relay_default

volumes:
  storage-state: